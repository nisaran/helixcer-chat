name = "helixcer-chat-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
APP_NAME = "Helixcer Chat"
ALLOWED_ORIGINS = "https://chat.helixcer.com"
APP_ORIGIN = "https://chat.helixcer.com"
DEFAULT_WORKSPACE_ID = "ws_default"
SESSION_TTL_SECONDS = "604800"
RECOVERY_MODE = "false"
OAUTH_RATE_LIMIT_WINDOW_SECONDS = "600"
OAUTH_RATE_LIMIT_PER_CLIENT = "10"
OAUTH_RATE_LIMIT_GLOBAL = "500"
EXTERNAL_API_RATE_LIMIT_WINDOW_SECONDS = "60"
EXTERNAL_API_RATE_LIMIT_PER_KEY = "60"
EXTERNAL_API_RATE_LIMIT_PER_WORKSPACE = "300"
VAPID_PUBLIC_KEY = "BETUPEI3m52cSFPKhXwudMNafx5YSTCSlaw-UnFeGabbvEKsQKRaFAVM55GqvbvCsLuENI_o1fRc7SlZpk4t4fQ"
VAPID_SUBJECT = "mailto:nisaran@helixcer.com"

[[d1_databases]]
binding = "DB"
database_name = "helixcer-chat-v2"
database_id = "45386cc5-53bf-481c-b678-01fc1ae2c58c"
migrations_dir = "worker/migrations"

[[durable_objects.bindings]]
name = "INBOX_HUB"
class_name = "InboxHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxHub"]

[triggers]
crons = ["* * * * *"]

